<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicação Animada</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <div class="item active" style="--background: #ea3d41">
            <div class="titulo">Morango</div>
            <img src="Morango-refrigerante-foregroundBlur.png" alt="Fruta morango" class="fruta">
            <img src="Morango-refrigerante.png" alt="Lata morango" class="refri">
        </div>

        <div class="item" style="--background: #E7A043">
            <div class="titulo">Laranja</div>
            <img src="Laranja-refrigerante-foregroundBlur.png" alt="Fruta laranja" class="fruta">
            <img src="Laranja-refrigerante.png" alt="Lata laranja" class="refri">
        </div>

        <div class="item" style="--background: #2D5643">
            <div class="titulo">Abacate</div>
            <img src="Abacate-refrigerante-foregroundBlur.png" alt="Fruta abacate" class="fruta">
            <img src="Abacate-refrigerante.png" alt="Lata abacate" class="refri">
        </div>

        <div class="arrow">
            <button id="prev"> < </button> 
            <button id="next"> > </button>
        </div>

    </main>
</body>
<script src="./scripts.js"></script>

</html>
